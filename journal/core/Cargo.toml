[package]
name = "journal-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Coeur de Rayan's Journal : archive chiffrée (événements et conversations), imports officiels, recherche, conservation et export"

[lib]
name = "journal_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
regex = "1"
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
