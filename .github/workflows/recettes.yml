# Rayan's Recettes (recettes) : vérification du typage, tests unitaires, paquet Windows, lancement du paquet comme
# un double-clic (l'application lit des recettes d'exemple, coche une recette et vérifie la liste de courses), puis
# ZIP prêt pour Rayan's Launcher (avec sa fiche rayans-launcher.json) dans les « Artifacts ».
name: Rayan's Recettes

on:
  push:
    paths:
      - 'recettes/**'
      - '.github/workflows/recettes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 64 bits
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: recettes
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_PUBLISH: never
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Typage TypeScript
        run: npm run typecheck
      - name: Tests unitaires (recettes.md, fiches, liste de courses, données)
        run: npm test
      # Version : majeur.mineur de package.json, correctif = numéro d'exécution de la CI. Chaque construction est
      # ainsi une mise à jour pour Rayan's Launcher.
      - name: Version de la construction
        id: version
        run: |
          V=$(node -p "const [a,b]=require('./package.json').version.split('.'); a+'.'+b+'.'+process.env.GITHUB_RUN_NUMBER")
          echo "Version : $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Construction du paquet
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never -c.extraMetadata.version=${{ steps.version.outputs.v }}
      - name: Lancement du paquet comme un double-clic
        env:
          RECETTES_CAPTURES: ${{ github.workspace }}/recettes/resultats/captures
        run: node scripts/test-lancement.mjs "dist/win-unpacked/Rayans Recettes.exe"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rayans-recettes-captures
          path: recettes/resultats/
          if-no-files-found: ignore
      # Rayan's Launcher : fiche rayans-launcher.json ajoutée à la racine du ZIP.
      - name: Paquet pour Rayan's Launcher
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.v }}'
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $fiche = [ordered]@{
            id = 'rayans-recettes'
            name = "Rayan's Recettes"
            description = 'Les recettes trouvées par Rayan''s Favoris : remarques halal et sèche, filtres, favoris, liste de courses.'
            version = $v
            releaseNotes = "Construction CI n°$env:GITHUB_RUN_NUMBER (commit $sha)."
            executable = 'Rayans Recettes.exe'
          }
          [IO.File]::WriteAllText("$PWD/rayans-launcher.json", ($fiche | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $zip = Get-Item "dist/Rayans-Recettes-$v-Windows-x64.zip"
          Compress-Archive -Path rayans-launcher.json -DestinationPath $zip.FullName -Update
          New-Item -ItemType Directory -Force launcher | Out-Null
          Copy-Item $zip.FullName "launcher/Rayans-Recettes-$v.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: Rayans-Recettes-pour-le-launcher
          path: recettes/launcher/*.zip
          compression-level: 0

  # Sur main seulement : release GitHub + catalogue signé de Rayan's Launcher (voir launcher/README.md).
  publier:
    name: Publication dans Rayan's Launcher
    needs: windows
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/rayans-launcher-publier.yml
    with:
      artifact: Rayans-Recettes-pour-le-launcher
      icon: recettes/build/icon.png
    secrets: inherit
