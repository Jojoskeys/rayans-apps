# Construction et vérification de Rayan's Ouvertures (Windows 64 bits) : tests unitaires (dont Stockfish réel),
# paquet, lancement « double-clic » du paquet, puis ZIP pour Rayan's Launcher dans les « Artifacts » de l'exécution.
name: Rayans Ouvertures - paquet Windows

on:
  push:
    paths:
      - 'echecs-ouvertures/**'
      - '.github/workflows/echecs-ouvertures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 64 bits
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: echecs-ouvertures
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_PUBLISH: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/fetch-stockfish.js win-x64
      - run: npm run build:ui
      - name: Tests unitaires (répertoire, exercices, serveur, moteur natif)
        run: npm test
      - name: Construction du paquet
        run: npx electron-builder --win --x64 --publish never
      - name: Lancement du paquet comme un double-clic
        run: node scripts/test-lancement.js "dist/win-unpacked/Rayans Ouvertures.exe"
      # Rayan's Launcher : fiche rayans-launcher.json ajoutée au ZIP Windows. Version vue par le launcher :
      # majeur.mineur de package.json, correctif = numéro d'exécution de la CI + 100 (comme les autres applications).
      - name: Paquet pour Rayan's Launcher
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $p = $pkg.version.Split('.')
          $v = "$($p[0]).$($p[1]).$([int]$env:GITHUB_RUN_NUMBER + 100)"
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $fiche = [ordered]@{
            id = 'rayans-ouvertures'
            name = "Rayan's Ouvertures"
            description = "Entraînement aux ouvertures d'échecs à partir de vos parties Chess.com (Stockfish, répétition espacée)."
            version = $v
            releaseNotes = "Construction CI n°$env:GITHUB_RUN_NUMBER (commit $sha)."
            executable = 'Rayans Ouvertures.exe'
          }
          [IO.File]::WriteAllText("$PWD/rayans-launcher.json", ($fiche | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $zip = Get-ChildItem dist/Rayans-Ouvertures-*-Windows-x64.zip | Select-Object -First 1
          if (-not $zip) { throw "ZIP Windows introuvable dans dist/" }
          Compress-Archive -Path rayans-launcher.json -DestinationPath $zip.FullName -Update
          New-Item -ItemType Directory -Force launcher | Out-Null
          Copy-Item $zip.FullName "launcher/Rayans-Ouvertures-$v.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Rayans-Ouvertures-pour-le-launcher
          path: echecs-ouvertures/launcher/*.zip
          compression-level: 0

  # Sur main seulement : release GitHub + catalogue signé de Rayan's Launcher (voir launcher/README.md).
  publier:
    name: Publication dans Rayan's Launcher
    needs: windows
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/rayans-launcher-publier.yml
    with:
      artifact: Rayans-Ouvertures-pour-le-launcher
      icon: echecs-ouvertures/build/icon.png
    secrets: inherit
