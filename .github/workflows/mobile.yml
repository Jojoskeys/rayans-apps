# Rayan's Mobile (mobile) : tests des règles de fusion, construction de la web app (accueil + Révision, Aujourd'hui,
# Hifz, Prière, Chrono, Ouvertures, qui réutilisent le code des apps Windows), puis publication sur GitHub Pages
# (https://jojoskeys.github.io/rayans-apps/). Aucune donnée personnelle ici : elles passent par le dépôt privé.
name: Rayan's Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'revision/src/**'
      - 'revision/public/**'
      - 'memoire/src/**'
      - 'memoire/public/**'
      - 'sommeil/src/**'
      - 'sommeil/public/**'
      - 'focus/src/**'
      - 'focus/public/**'
      - 'calcul/src/**'
      - 'calcul/public/**'
      - 'aujourdhui/src/**'
      - 'coran-memorisation/src/**'
      - 'coran-memorisation/data/**'
      - 'coran-memorisation/fonts/**'
      - 'priere/src/**'
      - 'chrono/src/**'
      - 'echecs-ouvertures/src/**'
      - 'launcher/assets/hangar-logo.png'
      - 'arene/**'
      - '.github/workflows/mobile.yml'
  schedule:
    - cron: '17 5 * * 1'   # chaque lundi : prix et résultats de l'Arène à jour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    name: Construction
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Tests des règles de fusion
        run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Arène (prix publics et rapports ; sans réseau, la tuile l'indique)
        working-directory: .
        continue-on-error: true
        run: |
          pip install --quiet numpy yfinance
          python arene/publier.py arene/publie
      - name: Construction
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/dist

  publier:
    name: Publication sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
