[package]
name = "rayans-revision"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Rayan's Révision : cartes de révision et quiz avec répétition espacée"

[lib]
name = "revision_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
