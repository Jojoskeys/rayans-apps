[package]
name = "rayans-revision"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Rayan's Révision : cartes de révision et quiz avec répétition espacée"

[lib]
name = "revision_lib"
# Application de bureau uniquement : pas de cdylib/staticlib (utiles seulement pour Android/iOS).
crate-type = ["rlib"]
# Les tests sont dans tests/files.rs (un exe de test lié à Tauri ne démarre pas sans manifeste Windows).
test = false
doctest = false

[[bin]]
name = "rayans-revision"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
