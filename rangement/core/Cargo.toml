[package]
name = "rangement-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Coeur de Rayan's Rangement : règles, aperçu, déplacements sans écrasement, doublons et historique annulable"

[lib]
name = "rangement_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
getrandom = "0.3"
lopdf = { version = "0.47", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
